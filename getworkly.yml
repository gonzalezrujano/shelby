name: "Getworkly"
description: "Pipeline to verify that the Evolution API service is running in production for the Getworkly project."
interval: 1m

steps:
  - id: check_api
    type: http_get
    source: "http://eig.exitosites.com:8080/"

output:
  check: "${steps.check_api.output.status_code}"
  message: "${steps.check_api.output.body.message}"
  version: "${steps.check_api.output.body.version}"
  clientName: "${steps.check_api.output.body.clientName}"
  manager: "${steps.check_api.output.body.manager}"
  documentation: "${steps.check_api.output.body.documentation}"
  whatsappWebVersion: "${steps.check_api.output.body.whatsappWebVersion}"
