<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ dashboard.Name }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d1a;
      color: #e0e0ff;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 16px;
    }

    .shelby-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e1e3a;
    }
    .shelby-header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.02em; }
    .shelby-header p { font-size: 0.8rem; color: #666; }
    .shelby-meta { margin-left: auto; font-size: 0.7rem; color: #444; }

    .shelby-grid {
      display: grid;
      grid-template-columns: repeat({{ dashboard.Columns }}, 1fr);
      gap: 12px;
    }

    .shelby-cell {
      background: #13132b;
      border: 1px solid #1e1e3a;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      grid-column: var(--sc) / span var(--sw);
      grid-row:    var(--sr) / span var(--sh);
    }

    @media (max-width: 768px) {
      .shelby-grid {
        grid-template-columns: 1fr;
      }
      .shelby-cell {
        grid-column: 1 / -1;
        grid-row: auto;
        min-height: 140px;
      }
    }

    shelby-widget {
      display: block;
      height: 100%;
      min-height: 120px;
    }
  </style>
</head>
<body>
  <header class="shelby-header">
    <h1>{{ dashboard.Name }}</h1>
    {% if dashboard.Description %}
    <p>{{ dashboard.Description }}</p>
    {% endif %}
    <span class="shelby-meta">shelby-viz &middot; refresh {{ dashboard.Refresh }}s</span>
  </header>

  <div class="shelby-grid">
    {% for wr in widget_renders %}
    <div class="shelby-cell"
         style="--sc:{{ wr.Widget.Col }};--sw:{{ wr.Widget.Width }};--sr:{{ wr.Widget.Row }};--sh:{{ wr.Widget.Height }};">
      <shelby-widget
        data-widget-id="{{ wr.Widget.Id }}"
        data-refresh="{{ dashboard.Refresh }}">
        {% if wr.Html %}
        <template shadowrootmode="open">
          {{ wr.Html|safe }}
        </template>
        {% endif %}
      </shelby-widget>
    </div>
    {% endfor %}
  </div>

  <script src="/static/runtime.js"></script>
  <script>
    ShelbyViz.init({ refresh: {{ dashboard.Refresh }} });
  </script>
  {% if live_reload %}
  <script>
    (function () {
      var es = new EventSource('/api/livereload');
      es.onmessage = function (e) { if (e.data === 'reload') location.reload(); };
      es.onerror   = function ()  { es.close(); setTimeout(function () { location.reload(); }, 500); };
    })();
  </script>
  {% endif %}
</body>
</html>
