[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shelby-viz"
version = "0.1.0"
description = "Dashboard renderer for Shelby pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["watchdog>=4.0"]

[project.scripts]
shelby-viz = "shelby_viz.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["shelby_viz"]
