name: System Health
interval: 15s

steps:
  - id: load
    type: shell
    command: "sysctl -n vm.loadavg | awk '{printf \"%.2f\", $2}'"

  - id: mem
    type: shell
    command: "ps -A -o rss | awk '{s+=$1} END {printf \"%.0f\", s/1024}'"

  - id: procs
    type: shell
    command: "ps -e | tail -n +2 | wc -l | awk '{printf \"%d\", $1}'"

  - id: api
    type: shell
    command: "curl -s -o /dev/null -w \"%{time_total}\" http://localhost:8080/api/pipelines | awk '{printf \"%.0f\", $1*1000}'"

output:
  load_1m:    ${steps.load.output.stdout}
  mem_rss_mb: ${steps.mem.output.stdout}
  proc_count: ${steps.procs.output.stdout}
  api_ms:     ${steps.api.output.stdout}
